name: Update predictions and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"   # refresh data and predictions every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: pip install -e "backend[dev]"

      - name: Fetch data
        working-directory: backend
        run: fplpredict fetch

      - name: Test
        working-directory: backend
        run: pytest -q

      - name: Predict and export JSON
        working-directory: backend
        run: fplpredict export --out ../web/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        env:
          VITE_FPL_PROXY: ${{ vars.FPL_PROXY }}   # optional CORS proxy for loading a team by ID
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
